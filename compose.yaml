services:
  app:
    build: .
    environment:
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/milestone
      DB_USER: milestone
      DB_PASSWORD: milestone
      LEDGER_ADMIN_SUBJECTS: admin
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # 应用内置健康检查类，无需 curl/wget
      test: ["CMD", "java", "-cp", "app.jar", "com.example.milestone.Healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: milestone
      POSTGRES_PASSWORD: milestone
      POSTGRES_DB: milestone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestone -d milestone"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
    volumes:
      - milestone-data:/var/lib/postgresql/data
volumes:
  milestone-data:
